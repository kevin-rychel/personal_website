<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">Conceptual overview of regulatory modules</title>
  <desc id="description">A small abstract data matrix is decomposed into three groups of genes that share common regulators. This conceptual illustration does not show measured results or an inferred biological network.</desc>
  <defs>
    <marker id="decomposition-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 8 6 2 10" fill="none" stroke="#c1c8c4" stroke-width="1.6" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#181d1e"/>
  <g fill="none" stroke="#eff1ec" stroke-opacity=".08" stroke-width="1">
    <path d="M64 88H896M64 510H896M64 104V496M896 104V496"/>
  </g>
  <path d="M222 192H304" fill="none" stroke="#c1c8c4" stroke-opacity=".40" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 7" marker-end="url(#decomposition-arrow)"/>

  <!-- The matrix cells and grid are unchanged; only their position has moved. -->
  <g transform="translate(94 122)">
    <g fill="none" stroke="#eff1ec" stroke-opacity=".15" stroke-width="1">
      <path d="M0 0H112M0 28H112M0 56H112M0 84H112M0 112H112M0 140H112M0 0V140M28 0V140M56 0V140M84 0V140M112 0V140"/>
    </g>
    <g fill="#80d7cd">
      <rect x="5" y="5" width="18" height="18" rx="2" opacity=".55"/><rect x="33" y="5" width="18" height="18" rx="2" opacity=".24"/><rect x="5" y="33" width="18" height="18" rx="2" opacity=".30"/><rect x="61" y="33" width="18" height="18" rx="2" opacity=".50"/>
    </g>
    <g fill="#d9b884">
      <rect x="33" y="61" width="18" height="18" rx="2" opacity=".45"/><rect x="89" y="61" width="18" height="18" rx="2" opacity=".22"/>
    </g>
    <g fill="#b6a5d5">
      <rect x="61" y="89" width="18" height="18" rx="2" opacity=".40"/><rect x="89" y="89" width="18" height="18" rx="2" opacity=".25"/><rect x="33" y="117" width="18" height="18" rx="2" opacity=".22"/><rect x="89" y="117" width="18" height="18" rx="2" opacity=".48"/>
    </g>
  </g>

  <!-- Each edge connects a central regulator to a gene in its module. -->
  <g transform="translate(190 -30)">
    <ellipse cx="254" cy="231" rx="119" ry="99" transform="rotate(-15 254 231)" fill="none" stroke="#80d7cd" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 9"/>
    <path d="M263 225 203 194M263 225 307 166M263 225 329 260M263 225 229 287" fill="none" stroke="#80d7cd" stroke-opacity=".40" stroke-width="2" stroke-linecap="round"/>
    <g fill="#80d7cd" stroke="#181d1e" stroke-width="5">
      <circle cx="203" cy="194" r="13"/><circle cx="263" cy="225" r="20"/><circle cx="307" cy="166" r="12"/><circle cx="329" cy="260" r="14"/><circle cx="229" cy="287" r="11"/>
    </g>
    <circle cx="263" cy="225" r="5" fill="#181d1e" fill-opacity=".65"/>
  </g>
  <g transform="translate(145 25)">
    <ellipse cx="465" cy="349" rx="118" ry="95" transform="rotate(12 465 349)" fill="none" stroke="#d9b884" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 9"/>
    <path d="M461 355 397 327M461 355 466 294M461 355 422 402M461 355 525 379M461 355 519 313M461 355 386 370M461 355 478 424" fill="none" stroke="#d9b884" stroke-opacity=".40" stroke-width="2" stroke-linecap="round"/>
    <g fill="#d9b884" stroke="#181d1e" stroke-width="5">
      <circle cx="397" cy="327" r="13"/><circle cx="461" cy="355" r="20"/><circle cx="466" cy="294" r="12"/><circle cx="422" cy="402" r="11"/><circle cx="525" cy="379" r="14"/>
      <circle cx="519" cy="313" r="13"/><circle cx="386" cy="370" r="12"/><circle cx="478" cy="424" r="11"/>
    </g>
    <circle cx="461" cy="355" r="5" fill="#181d1e" fill-opacity=".65"/>
  </g>
  <g transform="translate(150 -20)">
    <ellipse cx="613" cy="196" rx="108" ry="89" transform="rotate(-9 613 196)" fill="none" stroke="#b6a5d5" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 9"/>
    <path d="M610 216 551 189M610 216 597 147M610 216 575 258M610 216 661 169M610 216 681 225" fill="none" stroke="#b6a5d5" stroke-opacity=".40" stroke-width="2" stroke-linecap="round"/>
    <g fill="#b6a5d5" stroke="#181d1e" stroke-width="5">
      <circle cx="551" cy="189" r="13"/><circle cx="610" cy="216" r="20"/><circle cx="597" cy="147" r="12"/><circle cx="575" cy="258" r="11"/><circle cx="661" cy="169" r="12"/><circle cx="681" cy="225" r="13"/>
    </g>
    <circle cx="610" cy="216" r="5" fill="#181d1e" fill-opacity=".65"/>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#c1c8c4" font-size="32" text-anchor="middle">
    <text x="150" y="303" font-size="30">RNAseq data</text>
    <text x="444" y="338">iModulon 1</text>
    <text x="610" y="502">iModulon 2</text>
    <text x="763" y="303">iModulon 3</text>
  </g>
</svg>
